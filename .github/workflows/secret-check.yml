name: Secret Presence Sanity Check

on:
  workflow_dispatch:
    inputs:
      require_wandb:
        description: 'Require WANDB_API_KEY to be set? (yes/no)'
        required: false
        default: 'no'

jobs:
  secret-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check HF_TOKEN
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "❌ HF_TOKEN is not set in repository secrets"
            exit 1
          else
            echo "✅ HF_TOKEN is set"
          fi

      - name: Check WANDB_API_KEY (optional)
        if: ${{ github.event.inputs.require_wandb == 'yes' }}
        run: |
          if [ -z "${{ secrets.WANDB_API_KEY }}" ]; then
            echo "❌ WANDB_API_KEY is not set in repository secrets"
            exit 1
          else
            echo "✅ WANDB_API_KEY is set"
          fi
