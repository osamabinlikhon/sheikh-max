name: Release Sheikh-Max

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Validate scripts
      run: |
        python -m py_compile scripts/train_sheikh_max.py
        python -m py_compile scripts/inference.py
        python -m py_compile scripts/push_to_hub.py
    - name: Create release notes
      run: |
        echo "Sheikh-Max Release ${{ github.event.release.tag_name }}" > release_notes.md
        echo "Trained on Mistral-7B-Instruct-v0.2 with interleaved thinking." >> release_notes.md
        echo "Includes LoRA adapters and merged safetensors model." >> release_notes.md
    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: release_notes.md
        asset_name: release_notes.md
        asset_content_type: text/markdown